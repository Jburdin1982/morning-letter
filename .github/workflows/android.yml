name: Build Android app
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publish APK as a release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MorningLetter.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest MorningLetter.apk --title "Morning Letter (Android)" --notes "Install on Android: open this page on your phone, tap MorningLetter.apk, allow installs from this browser if asked."
