<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Word Fleet</title><style>
body{margin:0;background:#f7f0dd;color:#3a2a14;font-family:'Latin Modern Roman','CMU Serif',Georgia,serif;-webkit-user-select:none;user-select:none}
.w{max-width:520px;margin:8px auto;padding:12px;border:3px double #8a6a35;min-height:calc(100vh - 24px)}
h1{text-align:center;font-variant:small-caps;font-weight:normal;margin:4px 0;font-size:1.7rem}
.s{text-align:center;font-style:italic;font-size:.9rem;margin-bottom:8px}
.bar{display:flex;justify-content:space-around;font-size:1rem;margin:6px 0}
.bar b{font-size:1.3rem}
.msg{text-align:center;min-height:1.6em;font-size:1.05rem;margin:4px 0}
.grid{display:grid;grid-template-columns:22px repeat(var(--n,10),1fr);gap:2px;margin:6px 0}
.lab{font-size:.75rem;text-align:center;align-self:center;color:#8a6a35}
.c{aspect-ratio:1;border:1px solid #8a6a35;border-radius:4px;background:#efe5c8;font:inherit;font-size:1.1rem;font-weight:bold;color:#3a2a14;padding:0;display:flex;align-items:center;justify-content:center}
.c.sel{background:#d9b95f;border-width:2px}.c.found{background:#8a6a35;color:#f7f0dd}.c.hint{background:#e6c97a;outline:2px solid #8a6a35}.c.miss{background:#e7d3c5}
ul{list-style:none;padding:0;margin:8px 0}
li{padding:6px 8px;border-bottom:1px dotted #b99d62;font-size:.95rem}
li b{letter-spacing:.15em;font-family:monospace}li.done{opacity:.65}li.done .h{text-decoration:line-through}
.btn{font:inherit;background:#8a6a35;color:#f7f0dd;border:0;border-radius:6px;padding:10px 14px;margin:4px}
.btn.alt{background:#efe5c8;color:#3a2a14;border:1px solid #8a6a35}
.row{text-align:center}.rules{font-size:.85rem;font-style:italic;text-align:center;margin:6px 0}
.rank{text-align:center;font-size:1.2rem;font-variant:small-caps;margin:6px 0;min-height:1.5em}
.tiny{font-size:.8rem;text-align:center;color:#6b5a3c;margin-top:8px}
</style></head><body><div class="w">
<h1>Word Fleet</h1>
<div class="s">Each clue is a definition. Find its word in the grid: tap the first letter, then the last.</div>
<div class="bar"><div>Shots<br><b id="shots">0</b></div><div>Found<br><b id="fnd">0/5</b></div><div>Par<br><b id="par">5</b></div></div>
<div class="msg" id="m">Pick a word to start.</div>
<div class="grid" id="g"></div><ul id="f"></ul>
<div class="rank" id="rk"></div>
<div class="row"><button class="btn alt" id="hint">Hint (+2 shots)</button><button class="btn alt" id="rs">Start over</button></div>
<div class="rules">Every pick is one shot, right or wrong. 5 is perfect. Fewer shots, higher rank.<br>Admiral 5 &middot; Captain 6-7 &middot; First Mate 8-10 &middot; Deckhand 11+</div>
<div class="tiny" id="best"></div></div>
<script>
const FL={
 "date": "2026-11-07w",
 "size": 10,
 "grid": [
  "CHOGCSMIFW",
  "WUUAACJARD",
  "LMAKNHSWUI",
  "SBNMDUCBGA",
  "FLOMIKLEAI",
  "BEENDLFFLW",
  "EGONRCEHSD",
  "UTRANQUILU",
  "NDWAITWHSD",
  "MESINCEREF"
 ],
 "ships": [
  {
   "word": "CANDID",
   "hint": "Honest and straightforward, even when it's awkward",
   "r": 0,
   "c": 4,
   "dir": "D"
  },
  {
   "word": "FRUGAL",
   "hint": "Careful with money; not wasteful",
   "r": 0,
   "c": 8,
   "dir": "D"
  },
  {
   "word": "HUMBLE",
   "hint": "Not proud or boastful",
   "r": 0,
   "c": 1,
   "dir": "D"
  },
  {
   "word": "SINCERE",
   "hint": "Honest and genuine in what you say and feel",
   "r": 9,
   "c": 2,
   "dir": "A"
  },
  {
   "word": "TRANQUIL",
   "hint": "Calm, quiet and peaceful",
   "r": 7,
   "c": 1,
   "dir": "A"
  }
 ]
}
;const N=FL.size,K='wf4-'+FL.date,BK='wf4-best';
const $=id=>document.getElementById(id);
let st=(()=>{try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}})()||{shots:0,found:[],miss:[],hints:[],sel:null};
const grid=FL.grid.map(r=>r.split(''));
const cells=[];
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function cellsOf(s){const a=[];for(let k=0;k<s.word.length;k++)a.push([s.r+(s.dir=='D'?k:0),s.c+(s.dir=='A'?k:0)]);return a}
function rank(n){return n<=5?'Admiral':n<=7?'Captain':n<=10?'First Mate':'Deckhand'}
function build(){const g=$('g');g.style.setProperty('--n',N);g.innerHTML='';g.appendChild(document.createElement('div'));
 for(let c=0;c<N;c++){const d=document.createElement('div');d.className='lab';d.textContent=String.fromCharCode(65+c);g.appendChild(d)}
 for(let r=0;r<N;r++){const l=document.createElement('div');l.className='lab';l.textContent=r+1;g.appendChild(l);
  for(let c=0;c<N;c++){const b=document.createElement('button');b.className='c';b.textContent=grid[r][c];b.onclick=()=>tap(r,c);g.appendChild(b);cells.push(b)}}}
function render(msg){
 const foundCells=new Set();st.found.forEach(i=>cellsOf(FL.ships[i]).forEach(([r,c])=>foundCells.add(r*N+c)));
 const hintCells=new Set();st.hints.forEach(i=>{if(!st.found.includes(i)){const [r,c]=cellsOf(FL.ships[i])[0];hintCells.add(r*N+c)}});
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const b=cells[r*N+c],k=r*N+c;let cl='c';
  if(foundCells.has(k))cl+=' found';else if(st.sel&&st.sel[0]==r&&st.sel[1]==c)cl+=' sel';else if(hintCells.has(k))cl+=' hint';
  b.className=cl}
 const ul=$('f');ul.innerHTML='';
 FL.ships.forEach((s,i)=>{const d=st.found.includes(i);const li=document.createElement('li');li.className=d?'done':'';
  li.innerHTML='<b>'+(d?s.word.split('').join(' '):s.word.split('').map(()=>'_').join(' '))+'</b> &nbsp;<span class="h">'+s.hint+'</span>';ul.appendChild(li)});
 $('shots').textContent=st.shots;$('fnd').textContent=st.found.length+'/'+FL.ships.length;
 const done=st.found.length==FL.ships.length;
 if(msg)$('m').textContent=msg;
 if(done){$('rk').textContent='Rank: '+rank(st.shots)+' ('+st.shots+' shots)';$('m').textContent='Fleet found!';
  let b=null;try{b=JSON.parse(localStorage.getItem(BK))}catch(e){}
  if(!b||b.d!=FL.date){b=Object.assign({best:99,streak:0,last:null,played:0},b||{});
   b.best=Math.min(b.best,st.shots);b.played=(b.played||0)+1;b.d=FL.date;try{localStorage.setItem(BK,JSON.stringify(b))}catch(e){}}
  $('best').textContent='Best ever: '+b.best+' shots  ·  Games finished: '+b.played}
 else{$('rk').textContent='';let b=null;try{b=JSON.parse(localStorage.getItem(BK))}catch(e){}$('best').textContent=b?'Best ever: '+b.best+' shots':''}
}
function tap(r,c){
 if(st.found.length==FL.ships.length)return;
 if(!st.sel){st.sel=[r,c];save();render('Now tap the last letter.');return}
 const [r0,c0]=st.sel;
 if(r0==r&&c0==c){st.sel=null;save();render('Cancelled.');return}
 if(r0!=r&&c0!=c){st.sel=[r,c];save();render('Straight lines only (across or down). New first letter set.');return}
 st.sel=null;st.shots++;
 let hit=-1;FL.ships.forEach((s,i)=>{if(st.found.includes(i))return;const a=cellsOf(s),f=a[0],l=a[a.length-1];
  if((f[0]==r0&&f[1]==c0&&l[0]==r&&l[1]==c)||(l[0]==r0&&l[1]==c0&&f[0]==r&&f[1]==c))hit=i});
 if(hit>=0){st.found.push(hit);render('Yes! '+FL.ships[hit].word+'.')}
 else render('Miss. That is not one of the words.');
 save();
}
$('hint').onclick=()=>{const left=FL.ships.map((s,i)=>i).filter(i=>!st.found.includes(i)&&!st.hints.includes(i));
 if(!left.length||st.found.length==FL.ships.length)return;const i=left[0];st.hints.push(i);st.shots+=2;save();
 render('Hint: the first letter of "'+FL.ships[i].hint.split(';')[0].toLowerCase()+'" is marked. +2 shots.')};
$('rs').onclick=()=>{st={shots:0,found:[],miss:[],hints:[],sel:null};save();render('Fresh start.')};
build();render();
</script></body></html>
